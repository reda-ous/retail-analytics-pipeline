services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: retail-kafka
    environment:
      # Two listeners, for two different audiences: PLAINTEXT is for sibling
      # containers (producer/consumer) reaching the broker by service name;
      # PLAINTEXT_HOST is for anything running on the host machine (IDE runs,
      # a manual `kafka-console-consumer`) using `localhost`. Without this split,
      # whichever hostname the broker advertises breaks the other audience.
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Setting any KAFKA_* env var makes this image regenerate its whole config
      # from env vars, so these three (only ever baked into the image's default
      # properties file before) must be restated explicitly or KRaft mode breaks.
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # Same story again: Kafka's own hardcoded defaults for these internal
      # topics require 3 brokers. We only have 1, so without this override the
      # `__consumer_offsets` topic silently fails to auto-create and consumer
      # group coordination never completes.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "9092:9092"

  postgres:
    image: postgres:16-alpine
    container_name: retail-postgres
    environment:
      POSTGRES_DB: retail
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: retail
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  producer:
    build:
      context: .
      dockerfile: producer/Dockerfile
    container_name: retail-producer
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092

  consumer:
    build:
      context: .
      dockerfile: consumer/Dockerfile
    container_name: retail-consumer
    depends_on:
      - kafka
      - postgres
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: retail
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: retail
    ports:
      - "8080:8080"

volumes:
  postgres-data:
