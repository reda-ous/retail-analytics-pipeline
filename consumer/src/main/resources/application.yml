spring:
  application:
    name: consumer
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:retail}
    username: ${POSTGRES_USER:retail}
    password: ${POSTGRES_PASSWORD:retail}
  jpa:
    hibernate:
      # dev-only shortcut: a real project would use Flyway/Liquibase migrations instead
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: consumer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Wraps the real JsonDeserializer so a malformed message (bad JSON, unknown
      # eventType) becomes a normal exception the error handler below can see and
      # route to the DLT, instead of crashing the poll loop outright.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.retailpipeline.common.event
        spring.json.value.default.type: com.retailpipeline.common.event.SalesEvent
        spring.json.use.type.headers: false
    # Needed so the DefaultErrorHandler (see KafkaConsumerConfig) can publish
    # failed records to the dead-letter topic — this consumer never otherwise
    # produces anything itself.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    listener:
      # One virtual thread per partition: a slow downstream Postgres write on one
      # partition never blocks the other two from being consumed concurrently.
      concurrency: 3

retail:
  kafka:
    topic: sales-events
