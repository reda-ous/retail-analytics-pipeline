spring:
  application:
    name: consumer
  datasource:
    url: jdbc:postgresql://localhost:5432/retail
    username: retail
    password: retail
  jpa:
    hibernate:
      # dev-only shortcut: a real project would use Flyway/Liquibase migrations instead
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: consumer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.retailpipeline.common.event
        spring.json.value.default.type: com.retailpipeline.common.event.SalesEvent
        spring.json.use.type.headers: false

retail:
  kafka:
    topic: sales-events
